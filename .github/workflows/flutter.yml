name: Production CI/CD Quality Gates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Pin the Flutter version to match the team's toolchain.
env:
  FLUTTER_VERSION: "3.44.0"
  TEST_SET_PATH: "test_set"

jobs:
  production-gates:
    name: Production Quality & Security Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: actions/subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python 3.11 for Model Evaluation & ML Contract Gates
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ─── 1. Dependency Tree Gate ───────────────────────────────────────────
      - name: Install dependencies & verify dependency tree
        run: |
          flutter pub get
          flutter pub deps

      # ─── 1.5. Dependency Health Check ────────────────────────────────────────
      - name: Dependency health check
        continue-on-error: false
        run: |
          flutter pub outdated --fail-on-updates
      # ─── 2. Environment & Localization Gate ────────────────────────────────
      - name: Create placeholder .env
        run: |
          cat > .env <<'EOF'
          GHANA_NLP_SUBSCRIPTION_KEY=
          CLOUDINARY_CLOUD_NAME=
          CLOUDINARY_UPLOAD_PRESET=
          EOF

      - name: Generate localizations
        run: flutter gen-l10n

      # ─── 3. Code Formatting Gate (Hard Gate) ───────────────────────────────
      - name: Verify code formatting
        run: dart format --output=none --set-exit-if-changed lib test

      # ─── 4. Static Analysis & Lint Gate (Hard Gate) ────────────────────────
      - name: Static analysis (0 errors, 0 warnings, 0 fatal infos)
        run: flutter analyze --fatal-infos --fatal-warnings

      # ─── 5. Security & Secret Leakage Gate ─────────────────────────────────
      - name: Security & Firestore rules validation
        run: |
          flutter test test/security/firestore_rules_validation_test.dart
          flutter test test/regression/audit_bugs_regression_test.dart

      # ─── 6. Full Automated Test Suite Gate (All Layers) ───────────────────
      # Executes Unit -> Repository -> Database -> ML Contract -> Widget -> Integration -> Regression
      - name: Run full automated test suite (with coverage)
        run: flutter test --coverage

        # ─── 6. Integration Tests ────────────────────────────────────────────────
        - name: Run integration test suite
          continue-on-error: false
          run: flutter test integration_test --coverage

      - name: Upload code coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info
          if-no-files-found: ignore

      # ─── 7. ML Contract & Model Accuracy Gate (70% Release Floor) ──────────
      - name: ML contract & model accuracy evaluation
        env:
          TEST_SET: ${{ env.TEST_SET_PATH }}
        run: |
          if [ -d "$TEST_SET" ]; then
            python3 -m pip install --upgrade pip
            python3 -m pip install numpy pillow tflite-runtime
          fi
          python3 tools/evaluate_model.py \
            --model assets/cropguard_plant_disease_verified.tflite \
            --labels assets/labels_verified.txt \
            --test-set "$TEST_SET" \
            --min-accuracy 0.70

      # ─── 8. Android Build Compilation Gate ─────────────────────────────────
      - name: Build Android APK (clean environment compilation gate)
        run: flutter build apk --debug

      # ─── 9. iOS Toolchain & Config Gate ────────────────────────────────────
      - name: Verify iOS project configuration
        run: flutter build ios --config-only --no-codesign

  # ─── Production Release AAB Deployment Gate ────────────────────────────────
  build-release-android:
    name: Build Android (Release AAB)
    runs-on: ubuntu-latest
    needs: production-gates
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.KEYSTORE_BASE64 != ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Decode release keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo "$GOOGLE_SERVICES_BASE64" | base64 --decode > android/app/google-services.json

      - name: Build release AAB (signed)
        env:
          STORE_FILE: ${{ runner.temp }}/release.jks
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: flutter build appbundle --release

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
