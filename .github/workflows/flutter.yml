name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Pin the Flutter version to match the team's local toolchain.
env:
  FLUTTER_VERSION: "3.44.0"

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # A real .env is never committed. Generated localization + analysis only
      # need a placeholder so dotenv asset loading does not fail at build time.
      - name: Create placeholder .env
        run: |
          cat > .env <<'EOF'
          GHANA_NLP_SUBSCRIPTION_KEY=
          CLOUDINARY_CLOUD_NAME=
          CLOUDINARY_UPLOAD_PRESET=
          EOF

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Verify formatting
        # Non-blocking for now — flip to a hard gate once the tree is fully
        # formatted (run `dart format lib test` locally and commit).
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  # build-android is disabled until KEYSTORE_BASE64, GOOGLE_SERVICES_JSON_BASE64,
